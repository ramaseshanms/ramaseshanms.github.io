<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading... — Ramaseshan Subramanian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation -->
<nav class="nav scrolled">
  <div class="nav__inner">
    <a href="index.html" class="nav__logo">ram<span>.</span></a>
    <ul class="nav__links">
      <li><a href="index.html#experience">Experience</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#writing">Writing</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <button class="nav__mobile-toggle" id="nav-toggle" aria-label="Menu">&#9776;</button>
  </div>
</nav>

<!-- Article -->
<article class="article">
  <div class="container--narrow">
    <a href="index.html#writing" class="article__back">&larr; Back to writing</a>

    <div class="article__meta" id="article-meta">
      <h1 class="article__title" id="article-title">Loading...</h1>
      <div class="article__info" id="article-info"></div>
    </div>

    <div class="article__body" id="article-body">
      <p style="color: var(--text-muted);">Loading article...</p>
    </div>
  </div>
</article>

<!-- Footer -->
<footer class="footer">
  <div class="footer__links">
    <a href="index.html">Home</a>
    <a href="index.html#writing">Writing</a>
    <a href="index.html#contact">Contact</a>
  </div>
  <p class="footer__copy">Ramaseshan Subramanian &copy; 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) {
    document.getElementById('article-title').textContent = 'Article not found';
    document.getElementById('article-body').innerHTML = '<p>No article specified. <a href="index.html#writing">Back to writing</a>.</p>';
    return;
  }

  async function tryLoad() {
    try {
      const res = await fetch(`writing/${slug}.md`);
      if (res.ok) {
        const md = await res.text();
        renderArticle(md, slug);
        return;
      }
    } catch(e) {}
    document.getElementById('article-title').textContent = 'Article not found';
    document.getElementById('article-body').innerHTML =
      `<p>Could not find <code>writing/${slug}.md</code>. <a href="index.html#writing">Back to writing</a>.</p>`;
  }

  function renderArticle(md, slug) {
    // Extract title from first H1
    const titleMatch = md.match(/^#\s+(.+)$/m);
    const title = titleMatch ? titleMatch[1] : slug;

    // Extract subtitle/author from italicized line after title
    const authorMatch = md.match(/^\*(.+)\*$/m);
    const author = authorMatch ? authorMatch[1] : '';

    // Remove the title and author line from body
    let body = md;
    if (titleMatch) body = body.replace(titleMatch[0], '');
    if (authorMatch) body = body.replace(authorMatch[0], '');

    document.title = `${title} — Ramaseshan Subramanian`;
    document.getElementById('article-title').textContent = title;

    if (author) {
      document.getElementById('article-info').innerHTML = `<span>${author}</span>`;
    }

    // Configure marked
    marked.setOptions({
      gfm: true,
      breaks: false,
      headerIds: true
    });

    document.getElementById('article-body').innerHTML = marked.parse(body);
  }

  tryLoad();

  // Mobile nav toggle
  const toggle = document.getElementById('nav-toggle');
  const links = document.querySelector('.nav__links');
  if (toggle && links) {
    toggle.addEventListener('click', () => links.classList.toggle('open'));
  }
})();
</script>
</body>
</html>
